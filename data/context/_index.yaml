  #   name: Angebots-Template
  #   path: context/sources/angebots-template.md
  #   typ: dokument
  #   kontext_stufe: 1
  #   token_schaetzung: 1000
  #   status: Aktiv
  #   tags: [vertrieb, template]
  #   skills: [angebot-erstellen]
