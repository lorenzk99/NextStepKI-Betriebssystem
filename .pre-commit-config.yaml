# Pre-commit-Konfiguration.
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Manuell ausführen:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "^data/skills/.*\\.md$"  # Skill-Frontmatter ist YAML-in-MD
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'PYTHONPATH=src python -m pytest tests/ -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
